{% extends 'base.html' %}

{% block continut %}
    <h2>Bilete Acces</h2>

    <p id="mesajPlata"></p>

    <div class="admin-grid">
        {% for tip, info in preturi.items() %}
        <div class="admin-card">
            <h3>{{ tip|capitalize }}</h3>
            <p>{{ info.nume }}</p>
            <p><strong>{{ "%.2f"|format(info.suma) }} RON</strong></p>
            <button onclick="cumpara('{{ tip }}')">Cumpără</button>
        </div>
        {% endfor %}
    </div>

    <h3 style="margin-top: 40px;">Biletele mele</h3>
    <div id="biletele" class="admin-grid"></div>
{% endblock %}
