{% extends 'base.html' %}

{% block continut %}
    <h2>Panou Administrator</h2>

    <div class="admin-grid">
        <div class="admin-card">
            <h3>Caută Utilizator</h3>
            <input type="text" id="searchUser" placeholder="ID sau Email">
            <button onclick="cautaUtilizator()">Caută</button>
            <div id="rezultatUser"></div>
        </div>

        <div class="admin-card">
            <h3>Caută Tranzacții</h3>
            <input type="text" id="searchTx" placeholder="ID Tranzacție / Email Client">
            <button onclick="cautaTranzactie()">Caută</button>
            <div id="rezultatTx"></div>
        </div>

        <div class="admin-card">
            <h3>Validează Bilet la Intrare</h3>
            <input type="text" id="uuidBilet" placeholder="UUID Bilet">
            <button onclick="valideazaBilet()">Validează</button>
            <p id="mesajValidare"></p>
        </div>

        <div class="admin-card">
            <h3>Emite Bilet Manual</h3>
            <input type="email" id="newTicketEmail" placeholder="Email Utilizator">
            <select id="newTicketType">
                <option value="standard">Standard</option>
                <option value="vip">VIP</option>
            </select>
            <button onclick="adaugaBilet()">Emite Bilet</button>
        </div>
    </div>
{% endblock %}
